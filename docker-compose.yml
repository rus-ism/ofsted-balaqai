name: balaqai

services:
  db:
    image: mariadb:10.6
    container_name: balaqai-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
    volumes:
      - balaqai_db_data:/var/lib/mysql
      - ./sqldump.sql:/docker-entrypoint-initdb.d/01-sqldump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - balaqai

  wordpress:
    image: wordpress:php8.3-apache
    container_name: balaqai-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./files:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    networks:
      - balaqai

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./files:/var/www/html
    working_dir: /var/www/html
    user: "33:33"
    networks:
      - balaqai

volumes:
  balaqai_db_data:

networks:
  balaqai:
    driver: bridge
